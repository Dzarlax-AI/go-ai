name: Go CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        go: ['1.25.0', '1.26.10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        run: test "$(go env GOARCH)" = arm64
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go mod verify
  linux-arm64-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Compile all packages and tests for Linux ARM64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -exec /bin/true ./...
